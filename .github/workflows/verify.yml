name: Verify published analysis
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify scores and source statistics
        run: python scripts/verify_results.py
      - name: Install spatial verification dependency
        run: python -m pip install 'shapely>=2,<3'
      - name: Verify point-in-polygon counts
        run: python scripts/verify_spatial_join.py
